  sections:
    个人总结:
      - 4年Java开发经验：独立主导多个大型分布式系统从0到1的架构设计与全流程开发，具备丰富的微服务、高并发、多数据库混合架构实战经验。
      - 技术广度与深度：深入理解Spring Cloud Alibaba微服务生态（Nacos、Sentinel、Seata、Gateway），精通MyBatis-Plus与Spring Data MongoDB混合数据访问架构；掌握Redis多级缓存（Redisson + Caffeine）与Kafka消息驱动设计；具备MySQL、MongoDB、Elasticsearch、ClickHouse多数据库选型与调优能力。
      - 全栈交付能力：独立完成从需求分析、技术选型、架构设计到容器化部署的全链路交付，具备Docker容器化及国产化数据库迁移（达梦）经验。
      - AI工程化实践：基于LangChain4j + OpenAI兼容协议构建企业级智能问答与搜索服务，独立完成LLM模块的架构设计与业务集成。
